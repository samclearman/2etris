<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17132c">
  <title>2etris · Game room</title>
  <link rel="icon" href="/art/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/faultline.css">
  <script defer src="/main.js"></script>
</head>
<body>
  <main>
    <section id="room-error" class="scene lobby" hidden>
      <div class="scene-inner lobby-inner"><div class="panel room-panel" role="alert">
        <h1>Room unavailable</h1><p id="room-error-message" class="room-status"></p>
        <a class="text-link" href="/">Back to title</a>
      </div></div>
    </section>
    <section id="pregame" class="scene lobby" aria-labelledby="invite-title">
      <div class="scene-inner lobby-inner">
        <img class="room-logo" src="/art/marquee.svg" alt="2etris">
        <div class="panel room-panel">
          <h1 id="invite-title">Waiting for player two</h1>
          <label for="link">Invite a friend to play</label>
          <textarea id="link" rows="2" readonly spellcheck="false" placeholder="Preparing game link…"></textarea>
          <button type="button" class="button" id="copy-button" disabled>Copy link</button>
          <p id="copy-status" class="hint" role="status"></p>
        </div>
      </div>
    </section>

    <section id="match" class="match" aria-label="Match field" hidden>
      <div class="cabinet">
        <aside class="console left-console" aria-label="Scoreboard">
          <img class="small-logo" src="/art/marquee.svg" alt="2etris">
          <div class="ledger">
            <div class="meter" id="hero-meter"><label for="score-hero">You · <span id="hero-color"></span></label><div class="digits"><output id="score-hero" aria-live="off">0</output><svg id="hero-display" viewBox="0 0 23 5" aria-hidden="true" focusable="false"><path/></svg></div></div>
            <div class="meter" id="rival-meter"><label for="score-villian">Them · <span id="rival-color"></span></label><div class="digits"><output id="score-villian" aria-live="off">0</output><svg id="rival-display" viewBox="0 0 23 5" aria-hidden="true" focusable="false"><path/></svg></div></div>
            <div class="meter level"><label for="level">Level</label><output id="level" aria-live="off">1</output></div>
          </div>
          <details class="keys"><summary>Controls</summary>
            <dl><dt>Move</dt><dd>← / →</dd><dt>Soft drop</dt><dd>↓</dd><dt>Hard drop</dt><dd>Space</dd><dt>Rotate right</dt><dd>↑ / X</dd><dt>Rotate left</dt><dd>Ctrl / Z</dd><dt>Hold</dt><dd>Shift / C</dd></dl>
          </details>
        </aside>
        <div class="bezel"><canvas id="game" tabindex="-1" width="200" height="600" aria-label="Shared 10 by 30 field with opposing pieces and landing guides"></canvas></div>
        <aside class="console right-console" aria-label="Piece information">
          <div class="rack"><h2>Hold</h2><canvas id="hold" width="80" height="40" aria-label="Held piece"></canvas></div>
          <div class="rack"><h2>Next</h2><canvas id="preview" width="80" height="340" aria-label="Six next pieces, next at the bottom"></canvas><p class="queue-key">↑ Play order</p></div>
          <div class="match-actions"><button type="button" id="show-result" class="text-link" hidden>Final scores</button><button type="button" id="reset-button" class="text-link" data-new-game>New game</button></div>
        </aside>
      </div>
    </section>

    <section id="result" class="result" aria-labelledby="result-title" hidden>
      <div class="result-inner">
        <h1 id="result-title" tabindex="-1"><img src="/art/game-over.svg" alt="Game over"></h1>
        <dl class="final-scores"><div><dt>You · <span id="final-hero-color"></span></dt><dd id="final-hero"></dd></div><div><dt>Them · <span id="final-rival-color"></span></dt><dd id="final-rival"></dd></div></dl>
        <p class="final-level">Final level <strong id="final-level"></strong></p>
        <div class="result-actions"><button type="button" class="button" data-new-game>New game →</button><button type="button" class="text-link" id="view-field">View final field</button></div>
      </div>
    </section>
  </main>
</body>
</html>
