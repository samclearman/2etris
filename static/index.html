<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17132c">
  <title>2etris · Faultline Arcade</title>
  <link rel="icon" href="/art/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/faultline.css">
  <script defer src="/choose.js"></script>
</head>
<body class="attract">
  <main class="scene title-scene">
    <div class="scene-inner">
      <p class="studio-credit eyebrow"><img src="/art/titan-8bit.svg" width="120" height="26" alt="Titan"><span>2 player puzzle</span></p>
      <h1 class="marquee"><a class="home-link" href="/"><img src="/art/marquee.svg" alt="2etris"></a></h1>
      <nav class="start-menu" aria-label="Play 2etris">
        <a id="create-button" class="menu-item primary-choice" href="/game">Create game</a>
        <details id="join-panel">
          <summary class="menu-item">Join with a code</summary>
          <form action="/game" method="get" class="join-form panel">
            <label for="code-input">Game code</label>
            <div class="entry-row">
              <input id="code-input" name="session" type="text" placeholder="8-character code" required spellcheck="false" autocapitalize="none" autocomplete="off">
              <button id="join-button" class="button" type="submit">Join →</button>
            </div>
          </form>
        </details>
      </nav>
    </div>
  </main>
</body>
</html>
